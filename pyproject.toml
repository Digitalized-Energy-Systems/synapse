[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1"
description = "SYnergistic iNfluence of Adaptive coupling Points in multi-energy System intEgration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rico Schrage", email = "rico.schrage@uni-oldenburg.de" }
]
# urls = { Homepage = "https://github.com/me/myproject" }

classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython"
]

dependencies = [
  "pandas",
  "numpy",
  "networkx",
  "scipy",
  "overrides",
  "monee[simbench] @ file:///home/rschrage/git/monee",
  "mango-agents @ file:///home/rschrage/git/mango",
  "plotly>=5.0",
  "kaleido",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "twine",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = [
    "integration: end-to-end tests that solve the network (require gurobi)",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
